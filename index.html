<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Busca de Personagens</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="search-row">
      <input id="query" aria-label="campo de busca" placeholder="Digite o nome do personagem" />
      <!-- custom format picker: shows small format icons next to each option -->
      <div id="formatControl" class="format-control" role="listbox" aria-label="Formato" tabindex="0" title="Formato" aria-expanded="false" aria-activedescendant="">
        <button class="format-toggle" aria-haspopup="listbox" aria-label="Selecionar formato">
          <span class="format-icon format-icon-placeholder"></span>
          <span class="format-label">Formato</span>
          <svg class="caret" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
        <ul class="format-list" role="presentation" hidden>

          <li role="option" data-value="1:1" class="format-item" tabindex="-1"><span class="format-icon format-icon-1-1"></span><span class="format-text">1:1</span></li>
          <li role="option" data-value="16:9" class="format-item" tabindex="-1"><span class="format-icon format-icon-16-9"></span><span class="format-text">16:9</span></li>
          <li role="option" data-value="4:3" class="format-item" tabindex="-1"><span class="format-icon format-icon-4-3"></span><span class="format-text">4:3</span></li>
          <li role="option" data-value="3:4" class="format-item" tabindex="-1"><span class="format-icon format-icon-3-4"></span><span class="format-text">3:4</span></li>
          <li role="option" data-value="9:16" class="format-item" tabindex="-1"><span class="format-icon format-icon-9-16"></span><span class="format-text">9:16</span></li>
        </ul>
      </div>
      <select id="qtySelect" aria-label="Quantidade" title="Quantidade">
        <option value="1">x1</option>
        <option value="4">x4</option>
        <option value="6">x6</option>
        <option value="8" selected>x8</option>
      </select>
    </div>

    <div class="search-row">
      <label for="action" class="visually-hidden">Ação</label>
      <textarea id="action" rows="2" placeholder="Digite uma ação para o seu personagem."></textarea>
    </div>

    <div class="action-row">
      <button id="btnSearch" class="btn primary large">Buscar Prompt</button>
    </div>

    <section id="result" class="result hidden" aria-live="polite">
      <div class="preview">
        <img id="resultImage" alt="imagem do personagem" src="" />
        <!-- image copy button placed under the image for mobile-friendly layout -->
        <button id="btnCopyImage" class="btn ghost btn-copy-image">Copiar imagem</button>
      </div>
      <div class="meta">
        <h2 id="resultTitle"></h2>
        <p id="resultDesc" class="desc"></p>
        <div class="actions">
          <button id="btnCopyText" class="btn">Copiar texto</button>
          <button id="btnExit" class="btn ghost">Sair</button>
        </div>
      </div>
    </section>

    <div id="hint" class="hint">Sistema de Busca de Prompt</div>
  </main>
</body>
</html>
